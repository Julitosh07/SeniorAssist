name: DevOps Build Pipeline - SeniorAssist

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-backend:
    name: 1. Build & Package Backend (FastAPI / Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install wheel

      - name: Validate Backend Compilation & Syntax
        run: |
          python -m compileall backend/app

  build-mobile:
    name: 2. Build & Package Android APK (Gradle Engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation
        run: npm run typecheck

      - name: Bundle JavaScript & Assets (Metro Bundler)
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Compile Native APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: SeniorAssist-Release-Candidate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
