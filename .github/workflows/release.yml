name: DevOps Release Pipeline - SeniorAssist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Build, Verify and Publish Formal Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm ci
          pip install -r backend/requirements.txt pytest httpx

      - name: 1. Run Automated Tests Gate (Quality Gate)
        run: npm test

      - name: 2. Build Release Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: 3. Compile Native Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 4. Copy and Generate Checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SeniorAssist.apk
          sha256sum SeniorAssist.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 5. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SeniorAssist.apk
            SHA256SUMS.txt
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
