name: DevOps Test Pipeline - SeniorAssist

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-tests:
    name: Continuous Quality Assurance & Testing Suite
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: 1. Static Typecheck (TypeScript 5.3)
        run: npm run typecheck

      - name: 2. Client & Accessibility Integrity Tests (40 Tests)
        run: npm run test:client

      - name: 3. Voice & WhatsApp Command Parsing Tests (7 Tests)
        run: npm run test:voice

      - name: 4. Backend NLU & JWT Security Tests (9 Tests)
        run: npm run test:backend
