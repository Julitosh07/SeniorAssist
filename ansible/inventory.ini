# Inventario de Servidores para Operacion DevOps - SeniorAssist
[backend_production]
prod.seniorassist.uts.edu.co ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/seniorassist_prod_key.pem

[backend_staging]
staging.seniorassist.uts.edu.co ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/seniorassist_staging_key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=seniorassist
app_port=8000
